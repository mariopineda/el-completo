name: Publicar El Completo (Quartz 5)
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Instalar dependencias
        run: npm ci
      - name: Instalar complementos de Quartz
        run: npx quartz plugin install
      - name: Generar menu semanal
        run: node scripts/generar-menu-semanal.mjs
      - name: Actualizar tarjetas de recetas recientes
        run: node scripts/generar-recetas-recientes.mjs
      - name: Preparar contadores y fichas de recetas
        run: node scripts/preparar-interfaz-recetas.mjs
      - name: Generar el sitio
        run: npx quartz build
      - name: Evitar indexacion en buscadores
        run: |
          python3 - <<'PY'
          from pathlib import Path
          site = Path('public')
          pages = list(site.rglob('*.html'))
          if not pages:
              raise SystemExit('ERROR: Quartz no genero archivos HTML')
          robots = '<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">'
          for page in pages:
              html = page.read_text(encoding='utf-8')
              if '</head>' not in html:
                  raise SystemExit(f'ERROR: falta head en {page}')
              if robots not in html:
                  html = html.replace('</head>', robots + '\n</head>', 1)
              page.write_text(html, encoding='utf-8')
          for name in ('sitemap.xml', 'index.xml', 'rss.xml', 'feed.xml'):
              for item in site.rglob(name):
                  item.unlink()
          assert all(robots in p.read_text(encoding='utf-8') for p in pages)
          print(f'NOINDEX aplicado a {len(pages)} paginas')
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
